name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]





jobs:


  test:
    name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node_version: [24, 23]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install && npm run ci



  stryker:
    name: Stryker tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install && npm run ci && npm run stryker



  release:
    name: Release
    needs: [test, stryker]
    # Owner push to main after the test matrix and Stryker succeeded. Skipped
    # on the template repo itself, and for Dependabot merges, which never move
    # the package version.
    if: >-
      github.event.repository.is_template != true
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.event.pusher.name == github.event.repository.owner.name
      && !contains(github.event.head_commit.message, 'dependabot/')
      && !contains(github.event.head_commit.message, 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Export tag to envvars
      run: |
        export TAG=v$(awk -F'"' '/"version": ".+"/{ print $4; exit; }' package.json)
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo $TAG

    # A release per version, not per merge: a merge that didn't bump the
    # version finds its tag already released and stops here, green.
    - name: Check whether this version is already released
      id: existing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "released=true" >> $GITHUB_OUTPUT
          echo "$TAG is already released; nothing to do."
        else
          echo "released=false" >> $GITHUB_OUTPUT
        fi

    # gh creates the tag at this commit and the release in one step via the
    # built-in token. Fall back to GitHub's generated notes when the checkout
    # lacks CHANGELOG.md.
    - name: Create the release
      if: steps.existing.outputs.released == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f CHANGELOG.md ]; then
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file CHANGELOG.md
        else
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        fi

    - name: Results page
      if: steps.existing.outputs.released == 'false'
      run: |
        echo '### Results!' >> $GITHUB_STEP_SUMMARY
        echo "* Released $TAG" >> $GITHUB_STEP_SUMMARY
